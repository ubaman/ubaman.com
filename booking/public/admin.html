<!doctype html><html lang="es-MX"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Agenda · Ubaman</title><link rel="stylesheet" href="/style.css"><script defer src="/admin.js"></script></head><body><main><p class="eyebrow">ADMINISTRACIÓN PRIVADA</p><h1>Tu agenda.</h1><form id="login"><label>Clave de administración<input type="password" id="key" required autocomplete="off"></label><button>Consultar reservas</button></form><p id="notice" role="status"></p><section id="panel" hidden><p>Bloquear un día impide nuevas reservas. Las sesiones ya pagadas se mantienen y se deben coordinar con el cliente.</p><form id="block"><label>Día en la zona horaria del coach<input type="date" id="day" required></label><button>Bloquear día</button></form><div id="blocked"></div><h2>Reservas</h2><div class="table-wrap"><table><thead><tr><th>Hora</th><th>Cliente</th><th>Estado</th><th>Total del pedido</th></tr></thead><tbody id="orders"></tbody></table></div><h2>Correos pendientes</h2><pre id="mail"></pre><button class="secondary" id="logout">Cerrar sesión</button></section></main></body></html>
